plugins { id 'com.android.application' }

android {
    namespace 'kg.luxon.autopp'
    compileSdk 35

    defaultConfig {
        applicationId 'kg.luxon.autopp'
        minSdk 26
        targetSdk 35
        versionCode 30403
        versionName '3.4.3-improved'
    }

    signingConfigs {
        release {
            storeFile file('keystore.jks')
            storePassword 'autopp2024'
            keyAlias 'autopp'
            keyPassword 'autopp2024'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
