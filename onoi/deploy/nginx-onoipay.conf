# OnoiPay — сниппет для nginx. Подключается внутри server-блока домена
# wwweeewww.fit (deploy/install-nginx.sh делает это автоматически):
#
#   server {
#       server_name wwweeewww.fit;
#       include /etc/nginx/snippets/onoipay.conf;
#       ...
#   }
#
# Приложение слушает 127.0.0.1:7030 и само ожидает префикс /onoipay,
# поэтому proxy_pass указан БЕЗ завершающего слэша (префикс не срезается).

location = /onoipay {
    return 301 /onoipay/;
}

location /onoipay/ {
    proxy_pass http://127.0.0.1:7030;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
    client_max_body_size 64m;
}
