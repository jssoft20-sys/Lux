# Стартовый server-блок (только HTTP) для домена без конфигурации nginx.
#   cp deployment/nginx/onoipay-site-http.example.conf /etc/nginx/sites-available/wwweeewww.fit
#   ln -s /etc/nginx/sites-available/wwweeewww.fit /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d wwweeewww.fit      # добавит HTTPS и редирект автоматически
server {
    listen 80;
    server_name wwweeewww.fit;
    include /etc/nginx/snippets/onoipay.conf;
}
