# OnoiPay — фрагмент для существующего server{} блока wwweeewww.fit (HTTPS).
# Подключите: include /etc/nginx/snippets/onoipay.conf; внутри server { listen 443 ssl; server_name wwweeewww.fit; ... }
# Другие location этого сервера не затрагиваются.

# Зоны limit_req (onoipay_login, onoipay_hook) объявлены в /etc/nginx/conf.d/onoipay-zones.conf (копирует install.sh).

location = /onoipay { return 301 /onoipay/; }

location /onoipay/api/auth/login {
    limit_req zone=onoipay_login burst=5 nodelay;
    proxy_pass http://127.0.0.1:7031;
    include /etc/nginx/snippets/onoipay-proxy.conf;
}

location /onoipay/api/webhooks/ {
    limit_req zone=onoipay_hook burst=60 nodelay;
    client_max_body_size 256k;
    proxy_pass http://127.0.0.1:7031;
    include /etc/nginx/snippets/onoipay-proxy.conf;
}

location /onoipay/ {
    client_max_body_size 12m;
    proxy_pass http://127.0.0.1:7031;
    include /etc/nginx/snippets/onoipay-proxy.conf;
}
