# Пример полного server-блока для домена, у которого уже есть сертификат Let's Encrypt.
# Зоны limit_req лежат в /etc/nginx/conf.d/onoipay-zones.conf (копирует install.sh).
# Если сертификата ещё нет — начните с onoipay-site-http.example.conf и выполните certbot --nginx -d wwweeewww.fit

server {
    listen 80;
    server_name wwweeewww.fit;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name wwweeewww.fit;

    ssl_certificate     /etc/letsencrypt/live/wwweeewww.fit/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wwweeewww.fit/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/snippets/onoipay.conf;

    # ... остальные location существующих сервисов ...
}
