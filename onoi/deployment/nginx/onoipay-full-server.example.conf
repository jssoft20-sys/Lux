# Пример полного server-блока, если для домена ещё нет конфигурации nginx.
# Сертификат: certbot --nginx -d wwweeewww.fit
limit_req_zone $binary_remote_addr zone=onoipay_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=onoipay_hook:10m rate=120r/m;

server {
    listen 80;
    server_name wwweeewww.fit;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name wwweeewww.fit;

    ssl_certificate     /etc/letsencrypt/live/wwweeewww.fit/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wwweeewww.fit/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/snippets/onoipay.conf;

    # ... остальные location существующих сервисов ...
}
