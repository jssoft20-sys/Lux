[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onoipay"
version = "1.0.0"
description = "OnoiPay — payment desk backend, Telegram bots and admin panel"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "qrcode>=7.4",
    "pillow>=10.0",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "cryptography>=41",
    "pywebpush>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.8"]
qr = ["zxing-cpp>=2.2"]

[project.scripts]
onoipay-server = "onoipay.server:main"
onoipay-worker = "onoipay.workers.main:main"
onoipay-bot = "onoibot.main_bot:main"
onoipay-support-bot = "onoibot.support_bot:main"
onoipay-admin = "onoipay.cli:main"

[tool.setuptools]
package-dir = {"onoipay" = "backend/onoipay", "onoibot" = "bot/onoibot"}

[tool.setuptools.packages.find]
where = ["backend", "bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B904", "UP007"]
