<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Continental BOT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23fcd535'/%3E%3Cpath d='M9 8h4.5v11.5H23V24H9z' fill='%231e2329'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">

  <header class="hdr">
    <div class="hdr-top">
      <div class="brand">CONTINENTAL <small>BOT</small> <span id="mode-pill" class="pill">…</span></div>
      <div class="hdr-actions">
        <span id="conn" class="conn" title="Связь"><i></i><b>…</b></span>
        <button class="ibtn" id="btn-theme" aria-label="Тема">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 16V5a7 7 0 0 1 0 14z"/></svg>
        </button>
        <button class="ibtn" id="btn-system" aria-label="Система">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
          <i id="sys-dot" class="sysdot"></i>
        </button>
      </div>
    </div>

    <div class="hero">
      <div class="hero-l">Баланс · <span id="hero-unit">USDT</span></div>
      <div class="hero-v"><span id="hero-value">0,00</span></div>
      <div class="hero-s">
        <span class="kv"><b id="hero-pnl" class="num">0,00</b><span>за день</span></span>
        <span class="kv"><b id="hero-unreal" class="num">0,00</b><span>нереализ.</span></span>
        <span class="kv"><b id="hero-free" class="num">0,00</b><span>свободно</span></span>
      </div>
    </div>
    <div class="chips" id="chips"></div>
  </header>

  <main id="main">
    <section class="view on" id="view-overview">
      <div class="card chart-card">
        <div class="card-h">
          <span class="ttl">Эквити</span>
          <div class="seg" id="range"><button data-h="1">1ч</button><button data-h="6" class="on">6ч</button><button data-h="24">24ч</button><button data-h="0">Всё</button></div>
        </div>
        <div id="chart" class="chart"></div>
        <div class="chart-foot"><b id="chart-delta" class="num"></b><span id="chart-note" class="muted"></span></div>
      </div>
      <div class="stats" id="stats"></div>
      <div class="card">
        <div class="card-h"><span class="ttl">Позиции <em id="ov-pos-n"></em></span><button class="lnk" data-go="positions">Все ›</button></div>
        <div id="ov-positions" class="list"></div>
      </div>
      <div class="card">
        <div class="card-h"><span class="ttl">Лучший сигнал</span><button class="lnk" data-go="signals">Все ›</button></div>
        <div id="ov-signal" class="best"></div>
      </div>
      <div class="card">
        <div class="card-h"><span class="ttl">Лента</span><button class="lnk" data-go="news">Все ›</button></div>
        <div id="ov-news" class="list"></div>
      </div>
    </section>

    <section class="view" id="view-positions">
      <div class="bar"><span class="title">Позиции <em id="pos-count"></em></span><button class="btn danger sm" id="btn-close-all">Закрыть все</button></div>
      <div id="positions" class="list cards"></div>
    </section>

    <section class="view" id="view-trades">
      <div class="bar"><span class="title">Сделки</span><div class="seg" id="trade-filter"><button data-f="all" class="on">Все</button><button data-f="BUY">Buy</button><button data-f="SELL">Sell</button></div></div>
      <div class="tstats" id="tstats"></div>
      <div class="card flush"><div id="trades" class="list"></div><div id="trades-pager" class="pager"></div></div>
    </section>

    <section class="view" id="view-signals">
      <div class="bar"><span class="title">Сигналы</span><span id="sig-note" class="muted"></span></div>
      <div class="card flush"><div id="signals" class="list"></div><div id="signals-pager" class="pager"></div></div>
    </section>

    <section class="view" id="view-news">
      <div class="bar"><span class="title">Лента</span><span id="news-note" class="muted"></span></div>
      <div class="card flush"><div id="news" class="list"></div><div id="news-pager" class="pager"></div></div>
    </section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="overview" class="on"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zm0 7h6v-5H4zm10 0h6V11h-6zm0-16v5h6V4z"/></svg><span>Обзор</span></button>
    <button data-tab="positions"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8v4h2V4h-7v2h4l-7 7-4-4-7 7z"/></svg><span>Позиции</span><i class="bdg" id="tab-pos-n" hidden></i></button>
    <button data-tab="trades"><svg viewBox="0 0 24 24"><path d="M4 5h16v2H4zm0 6h10v2H4zm0 6h16v2H4z"/></svg><span>Сделки</span></button>
    <button data-tab="signals"><svg viewBox="0 0 24 24"><path d="M3 14h3l2-6 3 10 3-14 3 10 2-4h2v2h-3l-3 6-3-10-3 12-3-8-1 4H3z"/></svg><span>Сигналы</span></button>
    <button data-tab="news"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zm2 2v12h12V6zm2 2h8v2H8zm0 4h8v2H8zm0 4h5v2H8z"/></svg><span>Лента</span></button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-bg" id="sheet-bg"></div>
    <div class="sheet-panel">
      <div class="sheet-handle"></div>
      <div class="sheet-head"><h3 id="sheet-title"></h3><button class="ibtn" id="sheet-close" aria-label="Закрыть"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M18.3 5.7L12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7l1.4-1.4 6.3 6.3 6.3-6.3z"/></svg></button></div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>

  <div id="toasts" class="toasts"></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
