# Необязательно: домен + HTTPS перед сервером (нужно для callback Optima Bank).
# 1) DNS домена → IP сервера  2) certbot --nginx -d luxar.example.kg  3) в админке → Сайт → Публичный адрес: https://luxar.example.kg
server {
    listen 80;
    server_name luxar.example.kg;
    client_max_body_size 20m;
    location / {
        proxy_pass http://127.0.0.1:7088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# В .env при работе за nginx укажите TRUST_PROXY=1
