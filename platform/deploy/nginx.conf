# ─────────────────────────────────────────────────────────────────────────────
#  Sprinter Go — конфигурация nginx для боевого домена
#
#  Куда класть:   /etc/nginx/sites-available/sprintergo
#  Включить:      ln -s /etc/nginx/sites-available/sprintergo /etc/nginx/sites-enabled/
#  Проверить:     nginx -t
#  Применить:     systemctl reload nginx
#
#  ПЕРЕД ЗАПУСКОМ поменять здесь ровно три вещи:
#    1) sprintergo.kg  — на свой домен (встречается в обоих блоках server)
#    2) /opt/sprintergo-platform/web — на путь, куда распакован сервис
#    3) пути к сертификатам, если certbot положил их не туда
#
#  Важное, из-за чего обычно всё ломается:
#    · SSE (живая карта, предложения курьеру) не работает при буферизации,
#      поэтому для путей .../stream ниже стоит proxy_buffering off. Не трогать.
#    · Внутри location нет ни одного add_header — он отменяет ВСЕ заголовки,
#      заданные выше. Кэш поэтому задаётся директивой expires.
# ─────────────────────────────────────────────────────────────────────────────

upstream sprintergo {
    server 127.0.0.1:7030;
    keepalive 32;
}

# ── HTTP: только редирект и место для проверки сертификата ───────────────────
server {
    listen 80;
    listen [::]:80;
    server_name sprintergo.kg www.sprintergo.kg;

    # certbot кладёт сюда файл проверки — этот путь редиректить нельзя
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: собственно сервис ─────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                       # на nginx старее 1.25.1 убрать эту строку
                                    # и написать «listen 443 ssl http2;»
    server_name sprintergo.kg www.sprintergo.kg;

    ssl_certificate     /etc/letsencrypt/live/sprintergo.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sprintergo.kg/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/sprintergo.kg/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Корень статики: отсюда nginx отдаёт стили, скрипты и шрифты сам,
    # не тревожа Python. Путь — до папки web внутри распакованного сервиса.
    root /opt/sprintergo-platform/web;

    server_tokens off;
    charset utf-8;
    client_max_body_size 2m;
    client_body_timeout 30s;

    # ── заголовки уровня server ───────────────────────────────────────────────
    # Живут только здесь: любой add_header внутри location стёр бы их все.
    # HSTS ставим именно тут — приложение не знает, что стоит за HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;

    # ── сжатие ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 900;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml text/xml application/xml;
    # шрифты woff2 уже сжаты внутри, второй раз жать их — только греть процессор

    access_log /var/log/nginx/sprintergo.access.log;
    error_log  /var/log/nginx/sprintergo.error.log warn;

    # ── ПОТОК СОБЫТИЙ: живая карта, предложения курьеру, статус заказа ────────
    # Самое хрупкое место всей связки. Nginx по умолчанию копит ответ в буфере
    # и отдаёт его целиком — для потока, который не заканчивается никогда, это
    # означает, что клиент не увидит ни одного события. Отсюда buffering off.
    location ~ ^/api/v1/.+/stream$ {
        proxy_pass http://sprintergo;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ── статика с диска ───────────────────────────────────────────────────────
    # Имена файлов не меняются от версии к версии, поэтому месяц в кэше —
    # это месяц, в течение которого браузер их вообще не запрашивает.
    location ~* ^/assets/.+\.(css|js|mjs|woff2|png|jpg|webp|svg|json)$ {
        expires 30d;
        access_log off;
        try_files $uri @app;
    }

    # Иконки и манифест меняются редко, но всё же чаще стилей.
    location ~* ^/(favicon\.svg|favicon-32\.png|apple-touch-icon\.png|icon-[a-z0-9-]+\.png|manifest-courier\.webmanifest)$ {
        expires 7d;
        access_log off;
        try_files $uri @app;
    }

    # Служебный воркер кэшировать нельзя: с ним курьеры застрянут на старой
    # версии приложения и никакое обновление до них не доедет.
    location = /sw-courier.js {
        expires -1;
        try_files $uri @app;
    }

    # ── всё остальное — приложению ────────────────────────────────────────────
    location / {
        proxy_pass http://sprintergo;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 5s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location @app {
        proxy_pass http://sprintergo;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Служебные файлы вроде .git или .env наружу не показываем никогда.
    location ~ /\. {
        deny all;
    }
}
