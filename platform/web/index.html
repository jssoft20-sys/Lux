<!doctype html>
<html lang="ru" data-app="client">
<head>
<meta charset="utf-8">
<!-- maximum-scale и user-scalable убирают зум страницы везде, кроме Safari:
     он этот запрет игнорирует. Поэтому зум там гасят touch-action в CSS
     и перехватчик второго тапа в core/ui.js. Щипок по карте остаётся живым. -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sprinter Go — грузоперевозки по Бишкеку</title>
<meta name="description" content="Спринтер, газель или грузовик с грузчиками. Цена известна до заказа, машину видно на карте.">
<!-- Светлая тема первая: сервис открывается светлым, тёмную человек выбирает сам. -->
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F4F6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sprinter Go">
<!-- default, а не black-translucent: на светлом фоне белые часы не видно. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">

<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<!-- Кириллица нужна на первом же экране, поэтому её грузим вперёд остальных подмножеств. -->
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/onest-cyrillic.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/inter-cyrillic.woff2" crossorigin>

<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/map.css">
<link rel="stylesheet" href="/assets/css/client.css">
<link rel="stylesheet" href="/assets/css/pay.css">
<link rel="stylesheet" href="/assets/css/shell.css">

<!-- Скрипты выключены — гасить заставку некому, поэтому её просто не показываем. -->
<noscript><style>.sg-splash { display: none; }</style></noscript>

<script>
  /* Три вещи до первой отрисовки, иначе экран успеет мигнуть чужим цветом.

     1. Тема. По умолчанию светлая — так решил владелец, системную настройку
        не спрашиваем. Ключ читаем и в сыром виде, и в виде JSON: клиент
        хранит его через JSON.stringify, курьер с админкой — строкой. После
        разбора кладём обратно в том виде, который ждёт скрипт этой страницы.
        Отдельная отметка sg_theme_set нужна вот зачем: выбор «как в системе»
        клиентское приложение хранит удалением ключа, и без отметки мы бы на
        следующей же загрузке молча переставили человека на светлую.
     2. Холодный ли это запуск. Заставку целиком показываем только при первом
        заходе за час и в установленном приложении: на каждой перезагрузке
        она надоедает.
     3. Цвет строки состояния: пока висит жёлтая заставка, полоса телефона
        тоже жёлтая, иначе сверху висит светлая плашка и это выглядит
        как недогруженная страница. Дальше цвет вернёт core/shell.js. */
  (function () {
    var r = document.documentElement;
    var theme = '';
    var chosen = false;
    try {
      var raw = localStorage.getItem('sg_theme');
      theme = String(raw === null || raw === undefined ? '' : raw).replace(/^"|"$/g, '');
      chosen = !!localStorage.getItem('sg_theme_set');
    } catch (e) { /* приватный режим: просто работаем без памяти */ }
    if (theme !== 'dark' && theme !== 'light' && theme !== 'auto') {
      theme = chosen ? 'auto' : 'light';
    }
    if (theme === 'auto') r.removeAttribute('data-theme');
    else r.dataset.theme = theme;
    try {
      localStorage.setItem('sg_theme_set', '1');
      if (theme === 'auto') localStorage.removeItem('sg_theme');
      else localStorage.setItem('sg_theme', JSON.stringify(theme));
    } catch (e) {}

    var cold = true;
    try {
      var seen = parseInt(localStorage.getItem('sg_seen_at') || '0', 10) || 0;
      var now = Math.floor(Date.now() / 1000);
      cold = (now - seen) > 3600;
      localStorage.setItem('sg_seen_at', String(now));
    } catch (e) {}
    if (window.matchMedia && matchMedia('(display-mode: standalone)').matches) cold = true;
    if (navigator.standalone === true) cold = true;
    r.dataset.boot = cold ? 'cold' : 'warm';

    var meta = document.querySelector('meta[name="theme-color"]');
    var accent = getComputedStyle(r).getPropertyValue('--accent').trim();
    if (meta && accent) meta.setAttribute('content', accent);
  })();
</script>

<script type="module" src="/assets/js/core/shell.js"></script>
<script type="module" src="/assets/js/client/app.js"></script>
</head>
<body>

<!-- ── заставка ─────────────────────────────────────────────────────────────
     Лежит прямо в разметке, поэтому видна с первого кадра — до того, как
     подключатся стили экранов и скрипты. Гасит её core/shell.js, когда
     шрифты подъехали и первый экран нарисовался: data-ready говорит ему,
     за каким местом следить. -->
<div class="sg-splash" id="sg-splash" data-ready="#panel-slot" aria-hidden="true">
  <div class="sg-splash__mark">
    <svg class="sg-splash__van" viewBox="0 0 512 512" width="132" height="132" aria-hidden="true" focusable="false">
      <g fill="currentColor">
        <path d="M96 196a24 24 0 0 1 24-24h150a24 24 0 0 1 24 24v130H96z"/>
        <path d="M310 216h58a24 24 0 0 1 19.6 10.2l32 45.6A24 24 0 0 1 424 286v40h-114z"/>
        <rect x="96" y="326" width="328" height="20" rx="10"/>
        <circle cx="172" cy="352" r="40"/>
        <circle cx="368" cy="352" r="40"/>
      </g>
      <g fill="currentColor" opacity=".5">
        <rect x="28" y="216" width="54" height="16" rx="8"/>
        <rect x="8" y="252" width="74" height="16" rx="8"/>
        <rect x="36" y="288" width="46" height="16" rx="8"/>
      </g>
      <!-- окно и диски вырезаны цветом заставки, чтобы знак читался силуэтом -->
      <g class="sg-splash__hole">
        <rect x="326" y="232" width="56" height="38" rx="8"/>
        <circle cx="172" cy="352" r="15"/>
        <circle cx="368" cy="352" r="15"/>
      </g>
    </svg>
    <span class="sg-splash__name">Sprinter Go</span>
  </div>
</div>

<div class="sg-app">

  <!-- Карта во весь экран: всё остальное лежит поверх неё. -->
  <div class="sg-map" id="map" data-map></div>

  <!-- Метка выбора точки: видна, только когда адрес ставят пальцем по карте. -->
  <div class="sg-center" id="center-pin" hidden aria-hidden="true">
    <span class="sg-center__pin"></span>
    <span class="sg-center__shadow"></span>
  </div>

  <header class="sg-top">
    <a class="sg-brand" href="/" aria-label="Sprinter Go">
      <img class="sg-brand__logo" src="/assets/img/logo.svg" width="30" height="30" alt="">
      <span class="sg-brand__name" id="brand-name">Sprinter Go</span>
    </a>

    <!-- Один переключатель на два языка: нажатие всегда меняет язык на второй. -->
    <button type="button" class="sg-lang lang-switch" id="lang-switch" data-lang data-t-aria="common.language" aria-label="Язык">
      <span class="sg-lang__i" data-lang-code="ru">RU</span>
      <span class="sg-lang__i" data-lang-code="ky">KY</span>
    </button>
  </header>

  <!-- Нижняя шторка: содержимое меняется по шагам заказа.
       Три положения (развёрнута, наполовину, до заголовка) и перетаскивание
       пальцем поднимает core/ui.js — он сам находит эту панель по data-sheet. -->
  <div class="sg-panel" id="panel" data-sheet data-sheet-map="#map">
    <div class="sg-panel__box">
      <!-- Грип: за него тянут панель, тап по нему сворачивает и разворачивает. -->
      <button type="button" class="sg-panel__grip" id="panel-grip"
              data-t-aria="ui.grip" aria-label="Потянуть панель" aria-expanded="true"></button>
      <div class="sg-panel__slot" id="panel-slot">
        <div class="sg-boot">
          <div class="sg-boot__bar"><i></i></div>
          <div class="sg-boot__text" data-t="common.loading">Загружаем</div>
        </div>
      </div>
    </div>
  </div>

</div>

<noscript>
  <div class="sg-noscript">
    Для заказа машины нужен включённый JavaScript. Включите его в настройках браузера
    или позвоните нам, и диспетчер оформит заказ сам.
  </div>
</noscript>

</body>
</html>
