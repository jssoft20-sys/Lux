worker_processes auto;
events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  sendfile on;
  server_tokens off;
  client_max_body_size 26m;

  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/s;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Security headers for the web apps
  map $sent_http_content_type $csp {
    ~text/html "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' wss: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
  }

  upstream api { server api:4000; }
  upstream mobile { server mobile:80; }
  upstream admin { server admin:80; }

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # ── mobile app + API: app.somex.kg ──
  server {
    listen 443 ssl http2;
    server_name app.somex.kg;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy $csp always;

    location /api/v1/auth/ { limit_req zone=auth burst=5 nodelay; proxy_pass http://api; include /etc/nginx/proxy.inc; }
    location /api/ { limit_req zone=api burst=40 nodelay; proxy_pass http://api; include /etc/nginx/proxy.inc; }
    location /socket.io/ { proxy_pass http://api; include /etc/nginx/proxy.inc; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }
    location / { proxy_pass http://mobile; }
  }

  # ── admin panel: admin.somex.kg (restrict by IP / VPN in production) ──
  server {
    listen 443 ssl http2;
    server_name admin.somex.kg;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # allow 203.0.113.0/24;  # office / VPN
    # deny all;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy $csp always;

    location /api/v1/admin/auth/ { limit_req zone=auth burst=5 nodelay; proxy_pass http://api; include /etc/nginx/proxy.inc; }
    location /api/ { limit_req zone=api burst=40 nodelay; proxy_pass http://api; include /etc/nginx/proxy.inc; }
    location /socket.io/ { proxy_pass http://api; include /etc/nginx/proxy.inc; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }
    location / { proxy_pass http://admin; }
  }
}
