# =====================================================================
# Sprinter Go — nginx для боевого запуска на домене sprintergo.kg
# Файл: /etc/nginx/sites-available/sprintergo.kg
# Включить: sudo ln -s /etc/nginx/sites-available/sprintergo.kg /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# HTTPS:    sudo certbot --nginx -d sprintergo.kg -d www.sprintergo.kg
#           (certbot сам добавит listen 443 ssl и редирект с http на https)
# HTTP/2:   после certbot замените в этом файле «listen 443 ssl;» на «listen 443 ssl http2;» (или добавьте «http2 on;» в nginx ≥ 1.25)
# =====================================================================

# Старый домен (если он ещё ваш) → новый, чтобы не потерять позиции в поиске.
# Раскомментируйте и выпустите для него сертификат: sudo certbot --nginx -d gruzoperevozki.biz.kg -d www.gruzoperevozki.biz.kg
# server {
#     listen 80;
#     listen [::]:80;
#     server_name gruzoperevozki.biz.kg www.gruzoperevozki.biz.kg;
#     return 301 https://sprintergo.kg$request_uri;
# }

# www → без www (после certbot добавьте такой же блок для 443)
server {
    listen 80;
    listen [::]:80;
    server_name www.sprintergo.kg;
    return 301 https://sprintergo.kg$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name sprintergo.kg;

    # ВАРИАНТ A (рекомендуется): nginx отдаёт файлы напрямую
    root /home/gotaxi;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/sprintergo.access.log;
    error_log  /var/log/nginx/sprintergo.error.log warn;

    # --- сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json application/xml image/svg+xml font/woff2;
    # brotli (если установлен модуль ngx_brotli):
    # brotli on; brotli_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # --- безопасность
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: https://mc.yandex.ru https://www.google-analytics.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://www.googletagmanager.com https://www.google-analytics.com; font-src 'self'; connect-src 'self' https://mc.yandex.ru https://www.google-analytics.com https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; frame-ancestors 'self'" always;

    # --- служебные файлы не отдаём
    location ~ /\.(?!well-known) { deny all; }
    location ~* ^/(server\.py|start\.sh|stop\.sh|status\.sh|restart\.sh|README\.md|server\.log|deploy/) { deny all; }

    # --- кэш: шрифты, картинки, css/js — год (css/js версионируются ?v=хэш в index.html), html — без кэша
    # add_header внутри location отменяет заголовки уровня server, поэтому кэш задаём через expires
    location ~* \.(woff2|woff|ttf|otf)$ {
        types { font/woff2 woff2; font/woff woff; font/ttf ttf; font/otf otf; }
        expires 365d;
        access_log off;
        try_files $uri =404;
    }
    location ~* \.(png|jpg|jpeg|webp|avif|gif|ico|svg)$ {
        expires 365d;
        access_log off;
        try_files $uri =404;
    }
    location ~* \.(css|js|mjs)$ {
        expires 365d;
        try_files $uri =404;
    }
    location = /manifest.webmanifest { types { application/manifest+json webmanifest; } expires 1d; }
    location = /sitemap.xml { expires 1h; }
    location = /robots.txt  { expires 1h; access_log off; }

    location / {
        expires -1;   # html без кэша
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # ВАРИАНТ B: проксировать на python-сервер (./start.sh, порт 7022) — тогда закомментируйте
    # root/index/location выше и раскомментируйте блок ниже:
    # location / {
    #     proxy_pass http://127.0.0.1:7022;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
