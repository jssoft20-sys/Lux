<style>
html,body{margin:0;padding:0;width:1200px;height:630px;overflow:hidden;background:#FFDF00}
body{font-family:'Manrope',ui-sans-serif,system-ui,Arial,sans-serif;color:#0B0B0D;-webkit-font-smoothing:antialiased}
.og{position:relative;width:1200px;height:630px;overflow:hidden;
  background:
    radial-gradient(760px 520px at 104% -8%, #FFF6BF 0%, rgba(255,246,191,0) 62%),
    radial-gradient(700px 520px at -6% 112%, #F3C900 0%, rgba(243,201,0,0) 60%),

.ring{position:absolute;border-radius:50%;border:3px solid rgba(11,11,13,.07)}
.ring.r1{width:560px;height:560px;right:-120px;top:-250px}
.ring.r2{width:760px;height:760px;right:-220px;top:-350px;border-width:2px;border-color:rgba(11,11,13,.045)}
.brand{position:absolute;left:64px;top:48px;display:flex;align-items:center;gap:18px}
.brand svg{width:64px;height:64px;filter:drop-shadow(0 12px 22px rgba(11,11,13,.16))}
.brand b{font-family:'Unbounded',sans-serif;font-weight:800;font-size:31px;letter-spacing:-.025em;line-height:1}
.brand b i{font-style:italic;font-weight:900}
.domain{position:absolute;right:64px;top:64px;font-weight:700;font-size:22px;color:#1C1C21;letter-spacing:.005em}
.domain::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#0B0B0D;margin:0 12px 2px 0;opacity:.7}
h1{position:absolute;left:62px;top:132px;margin:0;font-family:'Unbounded',sans-serif;font-weight:800;font-size:70px;line-height:1;letter-spacing:-.035em;width:820px;text-wrap:balance}
.sub{position:absolute;left:64px;top:302px;display:flex;align-items:center;gap:13px;font-size:26px;font-weight:700;color:#1C1C21;white-space:nowrap}
.sub .d{width:7px;height:7px;border-radius:50%;background:#0B0B0D;opacity:.45}
.sub .price{margin-left:4px;background:#0B0B0D;color:#FFDF00;padding:8px 18px 9px;border-radius:999px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:22px;letter-spacing:-.01em;box-shadow:0 12px 30px rgba(11,11,13,.18)}
.phone{position:absolute;left:64px;bottom:62px;display:flex;align-items:center;gap:16px;background:#0B0B0D;color:#FFFFFF;border-radius:999px;padding:16px 32px 16px 18px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:32px;letter-spacing:-.01em;box-shadow:0 22px 50px rgba(11,11,13,.24)}
.phone .ic{width:48px;height:48px;border-radius:50%;background:#FFDF00;display:grid;place-items:center;flex:none}
.phone small{display:block;font-family:'Manrope',sans-serif;font-weight:600;font-size:16px;color:#C9C9CF;letter-spacing:.01em;margin-top:4px}
.road{position:absolute;left:0;right:0;bottom:56px;height:4px;background:linear-gradient(90deg,rgba(11,11,13,0) 0%,rgba(11,11,13,0) 46%,rgba(11,11,13,.9) 52%,rgba(11,11,13,.9) 100%)}
.speed{position:absolute;left:520px;bottom:120px;width:100px}
.speed i{display:block;height:5px;border-radius:3px;background:#0B0B0D;opacity:.14;margin:14px 0}
.speed i:nth-child(1){width:96px}.speed i:nth-child(2){width:64px;margin-left:32px}.speed i:nth-child(3){width:80px;margin-left:16px}
.van{position:absolute;right:-6px;bottom:35px;width:600px;height:320px}
</style>
