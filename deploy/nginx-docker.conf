server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on; gzip_vary on; gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json application/xml image/svg+xml font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~* \.(woff2|woff|png|jpg|jpeg|webp|ico|svg)$ { expires 365d; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location ~* \.(css|js)$ { expires 365d; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location = /manifest.webmanifest { types { application/manifest+json webmanifest; } }
    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
