# Optional: put nginx in front of the Node server (domain + HTTPS).
# The site also works without nginx: http://<server-ip>:7033
server {
    listen 80;
    server_name helihop-travel.com www.helihop-travel.com;

    location / {
        proxy_pass http://127.0.0.1:7033;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
