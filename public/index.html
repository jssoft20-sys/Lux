<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#527da3" />
  <title>Telegram</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='32' fill='%2329a9eb'/><path d='M14 31l34-13-6 30-9-7-5 5-2-8z' fill='white'/></svg>" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/chat.css" />
  <link rel="stylesheet" href="/css/settings.css" />
  <link rel="stylesheet" href="/css/calls.css" />
  <link rel="stylesheet" href="/css/animations.css" />
</head>
<body>
  <div id="app-root">
    <div id="splash" class="splash">
      <div class="splash-logo">
        <svg viewBox="0 0 64 64" width="90" height="90"><circle cx="32" cy="32" r="32" fill="#29a9eb"/><path d="M14 31l34-13-6 30-9-7-5 5-2-8z" fill="#fff"/></svg>
      </div>
      <div class="splash-title">Telegram</div>
      <div class="splash-sub">Loading…</div>
    </div>
  </div>

  <!-- socket.io client is served by the server at /socket.io/socket.io.js -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/stickers.js"></script>
  <script src="/js/emoji.js"></script>
  <script src="/js/format.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/app.js"></script>
  <!-- feature modules -->
  <script src="/js/features/webrtc.js"></script>
  <script src="/js/features/voice.js"></script>
  <script src="/js/features/stickerpicker.js"></script>
  <script src="/js/features/pollcreator.js"></script>
  <!-- screens (each self-registers via App.registerScreen) -->
  <script src="/js/screens/auth.js"></script>
  <script src="/js/screens/chats.js"></script>
  <script src="/js/screens/chat.js"></script>
  <script src="/js/screens/contacts.js"></script>
  <script src="/js/screens/calls.js"></script>
  <script src="/js/screens/callscreen.js"></script>
  <script src="/js/screens/search.js"></script>
  <script src="/js/screens/settings.js"></script>
  <script src="/js/screens/privacy.js"></script>
  <script src="/js/screens/devices.js"></script>
  <script src="/js/screens/profile.js"></script>
  <script src="/js/screens/folders.js"></script>
  <script src="/js/screens/newgroup.js"></script>
  <script>window.App && App.boot();</script>
</body>
</html>
