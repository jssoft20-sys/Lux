# PayGo — фрагмент для существующего server{} блока wwweeewww.fit (HTTPS).
# Подключите: include /etc/nginx/snippets/paygo.conf; внутри server { listen 443 ssl; server_name wwweeewww.fit; ... }
# Другие location этого сервера не затрагиваются.

# Зоны limit_req (paygo_login, paygo_hook) объявлены в /etc/nginx/conf.d/paygo-zones.conf (копирует install.sh).

location = /paygo { return 301 /paygo/; }

location /paygo/api/auth/login {
    limit_req zone=paygo_login burst=5 nodelay;
    proxy_pass http://127.0.0.1:7035;
    include /etc/nginx/snippets/paygo-proxy.conf;
}

location /paygo/api/webhooks/ {
    limit_req zone=paygo_hook burst=60 nodelay;
    client_max_body_size 256k;
    proxy_pass http://127.0.0.1:7035;
    include /etc/nginx/snippets/paygo-proxy.conf;
}

location /paygo/ {
    client_max_body_size 12m;
    proxy_pass http://127.0.0.1:7035;
    include /etc/nginx/snippets/paygo-proxy.conf;
}
